<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>lauschbox</title>
<style>
:root{--base:#24273a;--mantle:#1e2030;--surf:#363a4f;--text:#cad3f5;--sub:#6e738d;--mauve:#c6a0f6;--green:#a6da95;--red:#ed8796;--sky:#91d7e3;--blue:#8aadf4}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--text);font:14px/1.4 ui-monospace,Menlo,monospace}
header{padding:12px 16px;background:var(--mantle);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;color:var(--mauve);font-size:18px}#cnt{color:var(--sub)}
h1 a{color:inherit;text-decoration:none}h1 a{display:inline-flex;align-items:center;gap:8px}h1 .logo{flex:none}h1 a:hover{text-decoration:underline}
.gh{display:inline-flex;align-items:center;gap:6px;color:var(--text);text-decoration:none;border:1px solid var(--surf);border-radius:8px;padding:2px 10px;font-size:13px}.gh:hover{border-color:var(--mauve)}
main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1100px;margin:auto}
section{min-width:0}
section{background:var(--mantle);border-radius:8px;padding:12px}
h2{margin:0 0 8px;font-size:13px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
button{background:var(--surf);color:var(--text);border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;margin:2px}
button:hover{background:#494d64}button:disabled{opacity:.4;cursor:not-allowed}
button.on{outline:1px solid var(--green)}button.on::before{content:"● ";color:var(--green)}
button:not(.on)::before{content:"○ ";color:var(--red)}button.plain::before{content:""}
#devs{max-height:260px;overflow:auto;margin:8px 0}
#devs label{display:flex;gap:8px;padding:2px 4px}#devs label:hover{background:var(--surf)}
.i{color:var(--sub)}.act{color:var(--sky)}.ip{color:var(--blue)}
#log{max-height:55vh;overflow:auto}table{border-collapse:collapse;width:100%}
td{padding:1px 8px 1px 0;white-space:nowrap}tr.hit td{color:var(--red);font-weight:bold}
td:nth-child(1){color:var(--sub)}td:nth-child(2){color:var(--sky)}td:nth-child(3){color:var(--blue)}tr.hit td{color:var(--red)}
#err{color:var(--red)}
#devs label{flex-wrap:wrap;align-items:baseline}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary h2{display:inline;margin:0}summary::before{content:"▾ ";color:var(--mauve);font-size:20px;vertical-align:middle}
details:not([open])>summary::before{content:"▸ "}
@media(max-width:600px){
body{font-size:13px}header{padding:10px 12px}main{padding:10px;gap:10px}
button{padding:8px 12px}
#log{max-height:60vh}table,tbody{display:block}
tr{display:flex;flex-wrap:wrap;gap:0 8px;padding:3px 0;border-bottom:1px solid var(--surf)}
td{padding:0;white-space:normal}td:nth-child(4){flex-basis:100%;word-break:break-all}
}
</style></head><body>
<header><h1><a href="https://forbidden-fruits.github.io/lauschbox/" target="_blank" rel="noopener"><svg class="logo" viewBox="0 0 1024 1024" width="22" height="22" aria-hidden="true"><defs><linearGradient id="lbg" gradientUnits="userSpaceOnUse" x1="260" y1="240" x2="760" y2="790"><stop offset="0" stop-color="#c6a0f6"/><stop offset="1" stop-color="#91d7e3"/></linearGradient></defs><g fill="none" stroke="url(#lbg)" stroke-width="60" stroke-linecap="round"><path d="M616.1 423.9A115 115 0 0 0 616.1 600.1"/><path d="M532.5 324.3A245 245 0 0 0 532.5 699.7" opacity=".85"/><path d="M449 224.7A375 375 0 0 0 449 799.3" opacity=".62"/></g><rect x="668" y="407" width="80" height="210" rx="22" fill="url(#lbg)"/></svg>lauschbox</a></h1><a class="gh" href="https://github.com/forbidden-fruits/lauschbox" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub</a><span id="cnt"></span><span id="err"></span></header>
<main>
<section><h2>Schalter</h2><div id="sw"></div></section>
<section><details id="dsec"><summary><h2>Gerätefilter <span id="fn" class="i"></span></h2></summary>
<div id="devs"></div>
<button id="save" class="plain">Speichern</button><button id="all" class="plain">Alle</button><button id="ref" class="plain">Aktualisieren</button></details></section>
<section><h2>Live-Log</h2><div id="log"><table><tbody id="tb"></tbody></table></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
const SW=[["filter","filter_on","Gerätefilter"],["block","block_on","Sperrliste"],["tg","tg_on","Telegram"],["pause","paused","Pause"],["file","file_on","Datei-Log"]];
let st=null,dirty=false,sel=new Set(),since=0,devSig="";
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
async function post(key,value){
  try{const r=await fetch("/api/set",{method:"POST",body:JSON.stringify({key,value})});
    $("#err").textContent=r.ok?"":"Fehler: "+(await r.json()).error;}
  catch(e){$("#err").textContent="Server nicht erreichbar"}
}
function renderSw(){
  const box=$("#sw");box.textContent="";
  SW.forEach(([k,f,l])=>{
    const b=el("button",st[f]?"on":"",l);
    if(k==="tg"&&!st.tg_conf){b.disabled=true;b.title="Telegram nicht konfiguriert"}
    b.onclick=async()=>{await post(k,!st[f]);setTimeout(poll,300)};
    box.appendChild(b)});
  const c=el("button","plain","Puffer leeren");
  c.onclick=async()=>{await post("clear",null);$("#tb").textContent="";setTimeout(poll,300)};
  box.appendChild(c);
}
function renderDevs(){
  const sig=JSON.stringify([st.devices,st.filter_macs]);
  if(dirty||sig===devSig)return;
  devSig=sig;const box=$("#devs");box.textContent="";
  st.devices.forEach(d=>{
    const l=el("label"),cb=el("input");cb.type="checkbox";cb.checked=sel.has(d.mac);
    cb.onchange=()=>{dirty=true;cb.checked?sel.add(d.mac):sel.delete(d.mac)};
    l.append(cb,el("span",d.active?"act":"i",d.name||"(ohne Namen)"),el("span","ip",d.ip||"-"),el("span","i",d.mac+(d.guest?" · Gast":"")));
    box.appendChild(l)});
}
async function poll(){
  try{st=await (await fetch("/api/state")).json();$("#err").textContent=""}catch(e){$("#err").textContent="Server nicht erreichbar";return}
  if(!dirty){sel=new Set(st.filter_macs)}
  $("#cnt").textContent="Σ "+st.total+" · ⊘ "+st.hits+(st.reconnect?" · ↻ Reconnect":"");
  $("#fn").textContent="– aktiv: "+(st.filter_on?st.filter_names||"Alle Netzwerkgeräte":"Filter aus");
  renderSw();renderDevs();
}
async function tail(){
  try{const j=await (await fetch("/api/log?since="+since)).json();
    since=j.last;const tb=$("#tb");
    j.rows.forEach(r=>{const tr=el("tr",r[4]==="1"?"hit":"");
      r.slice(0,4).forEach(x=>tr.appendChild(el("td","",x)));tb.insertBefore(tr,tb.firstChild)});
    while(tb.rows.length>500)tb.deleteRow(-1);
  }catch(e){}
}
$("#ref").onclick=async()=>{const b=$("#ref");b.disabled=true;b.textContent="Lade …";await post("refresh",null);
  setTimeout(poll,3000);setTimeout(()=>{poll();b.disabled=false;b.textContent="Aktualisieren"},6000)};
$("#save").onclick=async()=>{await post("devices",[...sel]);dirty=false;devSig="";setTimeout(poll,300)};
$("#all").onclick=async()=>{await post("devices",[]);dirty=false;sel=new Set();devSig="";setTimeout(poll,300)};
poll();tail();setInterval(poll,2000);setInterval(tail,1000);
</script></body></html>
